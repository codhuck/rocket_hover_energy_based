project:
  name: project_1_lyapunov_control_planar_tvc_rocket
  description: Planar TVC rocket attitude stabilization with a Lyapunov-based inner loop

experiment:
  t_final: 20.0
  max_step: 0.02
  sample_count: 721
  rng_seed: 0

analysis:
  phi_error_band_rad: 0.1

initial_state:
  x: 0.0
  y: 8.0
  phi_deg: 90.0
  vx: 0.0
  vy: 0.0
  omega_deg_s: 0

rocket:
  g: 9.81
  mass: 13000
  F_max: 1.5*9.81*13000
  J_const: 318196.0
  l_cp: 10.3
  l: 18.0
  delta_max_deg: 15.0

controller:
  k_phi: 18.0
  k_omega: 7.0
  phi_target_deg: 41.0

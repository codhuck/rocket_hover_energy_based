# =============================================================================
# Example config: single-run + comparison setup.
#
# Usage:
#   python -m src.main --config configs/default.yaml --mode single
#   python -m src.main --config configs/default.yaml --mode comparison
# =============================================================================

rocket:
  g: 9.81
  rho: 1.225            # standard sea-level air density [kg/m^3]
  mass: 1.6
  J_const: 0.1183
  l_cp: 0.6091          # CoM-to-nozzle distance [m]
  l: 1.0                # rocket total length [m]
  S_mid: 0.01           # midship cross-section area [m^2]
  F_max: 30.0
  delta_max_deg: 15.0

  # Aerodynamic coefficients
  C_x: 0.358            # drag coefficient (constant in low-speed regime)
  C_yn: 3.096           # slope of C_y(alpha), 1/rad (= 0.05403/deg in radians)
  C_m_alpha_true: 1.054 # ground-truth pitching moment coefficient, 1/rad

initial_state:
  x: 0.0
  y: 8.0
  theta_deg: 10.0
  vx: 0.0
  vy: 5.0
  omega_deg_s: 0.0

experiment:
  t_final: 8.0
  sample_count: 1601
  max_step: 0.01

analysis:
  theta_error_band_rad: 0.1

# -----------------------------------------------------------------------------
# Single-run controller spec (used when --mode single).
# -----------------------------------------------------------------------------
controller:
  type: adaptive_ce
  k_theta: 12.0
  k_omega: 5.0
  gamma: 2.0
  c_hat_initial: 0.5
  c_hat_min: 0.1
  c_hat_max: 5.0
  theta_target_deg: 0.0

# -----------------------------------------------------------------------------
# Comparison spec (used when --mode comparison). Both controllers run on the
# same initial state and physics; only the controller block is swapped.
# -----------------------------------------------------------------------------
comparison:
  baseline:
    type: lyapunov
    k_theta: 12.0
    k_omega: 5.0
    theta_target_deg: 0.0

  adaptive:
    type: adaptive_ce
    k_theta: 12.0
    k_omega: 5.0
    gamma: 2.0
    c_hat_initial: 0.5
    c_hat_min: 0.1
    c_hat_max: 5.0
    theta_target_deg: 0.0

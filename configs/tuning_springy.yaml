project:
  name: project_1_lyapunov_control_planar_tvc_rocket_tuning_springy
  description: Planar TVC rocket attitude stabilization with a springy, lightly damped controller

experiment:
  t_final: 5.0
  max_step: 0.02
  sample_count: 721
  rng_seed: 0

analysis:
  phi_error_band_rad: 0.1

initial_state:
  x: 0.0
  y: 8.0
  phi_deg: 20.0
  vx: 0.0
  vy: 0.0
  omega_deg_s: -8.0

rocket:
  g: 9.81
  mass: 1.60
  F_max: 24.0
  J_const: 0.1183
  l_cp: 0.6091
  delta_max_deg: 15.0

controller:
  k_phi: 18.0
  k_omega: 2.0
  phi_target_deg: 0.0

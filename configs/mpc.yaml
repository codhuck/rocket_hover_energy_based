# =============================================================================
# 2D TVC rocket mission controlled by nonlinear MPC
#
# Mission:
#   intermediate point: (500, 1000)
#   final point:        (1000, 0)
#   speed limit:        <= 50 m/s
#
# Usage:
#   python -m src.main --config configs/mpc.yaml --output-root outputs/mpc --animate
# =============================================================================

rocket:
  g: 9.81
  rho: 1.225
  mass: 13000.0
  J_const: 318196.0
  l_cp: 10.3
  l: 18.0
  S_mid: 4.5216

  F_max: 191763.0
  F_min: 15000.0
  delta_max_deg: 15.0
  delta_max_cmd_deg: 15.0
  theta_max_deg: 45.0
  tau_delta: 0.08
  C_x: 0.358

mission:
  x_start: 0.0

  # Intermediate ascent target: (500, 1000)
  x_mid: 500.0
  h_target: 1000.0

  # Final point: (1000, 0)
  x_land: 1000.0
  y_land: 0.0

  # Speed limit
  v_max: 50.0

  eps_h: 8.0
  eps_v: 4.0

  eps_land: 1.0
  eps_vel: 4.0
  eps_x: 8.0
  eps_vx: 2.5
  eps_vy: 2.5
  eps_theta_deg: 6.0
  eps_omega_deg_s: 10.0

initial_state:
  x: 0.0
  y: 0.0
  vx: 0.0
  vy: 0.0
  theta_deg: 0.0
  omega_deg_s: 0.0
  delta_deg: 0.0

experiment:
  dt: 0.25
  t_final: 160.0

controller:
  type: mpc

  # Longer horizon is needed because the mission is much larger now.
  N: 36
  gimbal_blocks: 36
  thrust_blocks: 12
  control_blocks: 12
  dt: 0.25

  max_iter: 36
  optimizer: coordinate
  search_passes: 2
  initial_step: 0.08
  ftol: 8.0e-4

  landing_zone: 80.0
  landing_assist: true
  assist_altitude: 180.0
  assist_blend: 1.0
  assist_override_descent: true

  weights:
    R_delta: 0.12
    R_F: 0.045
    R_delta_rate: 0.045
    R_F_rate: 0.020

    px: 260.0
    py: 850.0
    pvx: 220.0
    pvy: 120.0
    ptheta: 260.0
    pomega: 80.0
    pdelta: 0.0

    ground: 10000.0
    theta_limit: 5000.0
    delta_limit: 3000.0

    near_ground: 130.0
    touchdown_x: 1300.0
    touchdown_v: 900.0
    touchdown_theta: 900.0
    touchdown_omega: 180.0

    # New soft speed-limit penalty.
    speed_limit: 12000.0

  scales:
    x: 1000.0
    y: 1000.0
    vx: 50.0
    vy: 50.0
    theta: 0.2094395102
    omega: 0.5235987756
    delta: 0.2617993878
    F: 60000.0
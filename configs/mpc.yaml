# =============================================================================
# 2D TVC rocket mission controlled by nonlinear MPC
#
# Improved landing version:
# - longer prediction horizon with move blocking;
# - strict touchdown gate in simulation;
# - stronger descent/near-ground soft landing constraints.
#
# Usage:
#   python -m src.main --config configs/mpc.yaml --output-root outputs/mpc
# =============================================================================

rocket:
  g: 9.81
  rho: 1.225
  mass: 13000.0             # constant mass [kg]
  J_const: 318196.0         # constant pitch inertia [kg*m^2]
  l_cp: 10.3                # CoM-to-nozzle distance [m]
  l: 18.0                   # reference rocket length [m]
  S_mid: 4.5216             # reference cross-sectional area [m^2]

  F_max: 191763.0           # 1.5*m*g [N]
  F_min: 15000.0            # minimum thrust [N]
  delta_max_deg: 15.0       # physical nozzle deflection limit
  delta_max_cmd_deg: 15.0   # commanded nozzle deflection limit
  theta_max_deg: 45.0       # soft pitch-angle state constraint
  tau_delta: 0.08           # first-order actuator time constant [s]
  C_x: 0.358                # drag coefficient

mission:
  x_start: 0.0
  h_target: 100.0 
  x_mid: 40.0        # новая целевая x-точка на верхней фазе      # ascent target height [m]
  x_land: 80.0              # landing x-coordinate [m]
  eps_h: 4.0                # ascent->descent height tolerance [m]
  eps_v: 2.5                # ascent->descent vertical velocity tolerance [m/s]

  # Touchdown is now considered successful only if all these gates are met.
  eps_land: 0.8             # landing height tolerance [m]
  eps_vel: 3.0              # total touchdown speed tolerance [m/s]
  eps_x: 5.0                # max horizontal landing error [m]
  eps_vx: 1.5               # max horizontal speed at touchdown [m/s]
  eps_vy: 1.5               # max vertical speed at touchdown [m/s]
  eps_theta_deg: 6.0        # max pitch angle at touchdown [deg]
  eps_omega_deg_s: 10.0     # max pitch rate at touchdown [deg/s]

initial_state:
  x: 0.0
  y: 0.0
  vx: 0.0
  vy: 0.0
  theta_deg: 0.0
  omega_deg_s: 0.0
  delta_deg: 0.0

experiment:
  dt: 0.25                  # simulator step and MPC apply interval [s]
  t_final: 55.0

controller:
  type: mpc
  N: 24                     # horizon time = N*dt = 6.0 s
  gimbal_blocks: 24         # keep gimbal pulses at sample resolution
  thrust_blocks: 8          # optimize slower piecewise-constant thrust blocks
  control_blocks: 8         # legacy alias; kept for compatibility
  dt: 0.25
  max_iter: 28
  optimizer: coordinate
  search_passes: 1
  initial_step: 0.08
  ftol: 8.0e-4
  landing_zone: 22.0        # near-ground landing soft constraints activate below this altitude [m]
  landing_assist: true      # terminal safety layer for the last meters
  assist_altitude: 150.0
  assist_blend: 1.0
  assist_override_descent: true

  # Dimensionless MPC weights. Stage cost still penalizes only control usage;
  # near-ground terms are soft landing constraints, not a prescribed trajectory.
  weights:
    R_delta: 0.08
    R_F: 0.035
    R_delta_rate: 0.020
    R_F_rate: 0.012
    px: 120.0
    py: 700.0
    pvx: 90.0
    pvy: 45.0
    ptheta: 110.0
    pomega: 28.0
    pdelta: 0.0
    ground: 10000.0
    theta_limit: 4000.0
    delta_limit: 2500.0
    near_ground: 55.0
    touchdown_x: 500.0
    touchdown_v: 420.0
    touchdown_theta: 350.0
    touchdown_omega: 80.0

  # Characteristic scales used to nondimensionalize terminal errors.
  scales:
    x: 80.0
    y: 50.0
    vx: 10.0
    vy: 10.0
    theta: 0.2094395102     # 12 deg [rad]
    omega: 0.5235987756     # 30 deg/s [rad/s]
    delta: 0.2617993878     # 15 deg [rad]
    F: 60000.0
